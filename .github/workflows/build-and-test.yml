name: build-and-test

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  PipelineEnvironment: true
  NUGET_XMLDOC_MODE: skip
  DOTNET_VERSION: 10.0.x
  CONFIGURATION: Release
  PROJECT: src/Soenneker.Azure.NotificationHubs.Maui/Soenneker.Azure.NotificationHubs.Maui.csproj
  TEST_PROJECT: test/Soenneker.Azure.NotificationHubs.Maui.Tests/Soenneker.Azure.NotificationHubs.Maui.Tests.csproj

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Android
            os: ubuntu-latest
            framework: net10.0-android
            workload: maui-android

          - name: iOS
            os: macos-latest
            framework: net10.0-ios
            workload: maui-ios

          - name: Windows
            os: windows-latest
            framework: net10.0-windows10.0.19041.0
            workload: maui-windows

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          workloads: ${{ matrix.workload }}

      - name: Restore
        run: dotnet restore ${{ env.PROJECT }} /p:TargetFramework=${{ matrix.framework }} --verbosity minimal

      - name: Build
        run: dotnet build ${{ env.PROJECT }} --configuration ${{ env.CONFIGURATION }} -f ${{ matrix.framework }} --no-restore --verbosity minimal

      - name: Restore tests
        if: matrix.name == 'Windows'
        run: dotnet restore ${{ env.TEST_PROJECT }} --verbosity minimal

      - name: Build tests
        if: matrix.name == 'Windows'
        run: dotnet build ${{ env.TEST_PROJECT }} --configuration ${{ env.CONFIGURATION }} --no-restore --verbosity minimal

      - name: Test
        if: matrix.name == 'Windows'
        run: dotnet test --project ${{ env.TEST_PROJECT }} --configuration ${{ env.CONFIGURATION }} --no-build --no-restore --verbosity minimal

  status:
    name: build-and-test
    runs-on: ubuntu-latest
    needs: build
    if: always()

    steps:
      - name: Check build matrix result
        shell: bash
        run: |
          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "Build matrix result: ${{ needs.build.result }}"
            exit 1
          fi
