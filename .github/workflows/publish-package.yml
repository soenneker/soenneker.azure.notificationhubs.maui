name: publish-package

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'test/**'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  PipelineEnvironment: true
  NUGET_XMLDOC_MODE: skip
  DOTNET_VERSION: 10.0.x
  CONFIGURATION: Release
  PROJECT: src/Soenneker.Azure.NotificationHubs.Maui/Soenneker.Azure.NotificationHubs.Maui.csproj
  PACKAGE_ID: Soenneker.Azure.NotificationHubs.Maui

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Android
            os: ubuntu-latest
            framework: net10.0-android
            output_framework: net10.0-android
            package_framework: net10.0-android36.0
            workload: maui-android
            artifact: android

          - name: iOS
            os: macos-latest
            framework: net10.0-ios
            output_framework: net10.0-ios
            package_framework: net10.0-ios26.0
            workload: maui-ios
            artifact: ios

          - name: Windows
            os: windows-latest
            framework: net10.0-windows10.0.19041.0
            output_framework: net10.0-windows10.0.19041.0
            package_framework: net10.0-windows10.0.19041
            workload: maui-windows
            artifact: windows

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          workloads: ${{ matrix.workload }}

      - name: Restore
        run: dotnet restore ${{ env.PROJECT }} /p:TargetFramework=${{ matrix.framework }} --verbosity minimal

      - name: Build
        run: dotnet build ${{ env.PROJECT }} --configuration ${{ env.CONFIGURATION }} -f ${{ matrix.framework }} --no-restore --verbosity minimal

      - name: Stage build output
        shell: pwsh
        run: |
          $source = Join-Path $env:GITHUB_WORKSPACE "src/Soenneker.Azure.NotificationHubs.Maui/bin/${{ env.CONFIGURATION }}/${{ matrix.output_framework }}"
          $target = Join-Path $env:GITHUB_WORKSPACE "artifacts/${{ matrix.package_framework }}"
          New-Item -ItemType Directory -Force -Path $target | Out-Null

          $packageId = "${{ env.PACKAGE_ID }}"

          foreach ($extension in @(".dll", ".xml", ".pdb", ".aar", ".pri")) {
            $file = Join-Path $source "$packageId$extension"
            if (Test-Path $file) {
              Copy-Item -Path $file -Destination $target -Force
            }
          }

      - name: Upload build output
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: artifacts/${{ matrix.package_framework }}

  pack:
    name: Pack and publish
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Download Android
        uses: actions/download-artifact@v8
        with:
          name: android
          path: package/lib/net10.0-android36.0

      - name: Download iOS
        uses: actions/download-artifact@v8
        with:
          name: ios
          path: package/lib/net10.0-ios26.0

      - name: Download Windows
        uses: actions/download-artifact@v8
        with:
          name: windows
          path: package/lib/net10.0-windows10.0.19041

      - name: List package inputs
        shell: bash
        run: find package -type f | sort

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setting up build version
        shell: bash
        run: |
          echo "BUILD_VERSION=4.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Get release notes from latest commit
        shell: bash
        run: |
          notes="$(git log -1 --pretty=%B | sed '/^Co-authored-by:/d')"
          {
            echo "PACKAGE_RELEASE_NOTES<<EOF"
            printf '%s\n' "$notes"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Create nuspec
        shell: bash
        run: |
          set -euo pipefail

          for framework in net10.0-android36.0 net10.0-ios26.0 net10.0-windows10.0.19041; do
            dll="package/lib/${framework}/${PACKAGE_ID}.dll"

            if [ ! -f "$dll" ]; then
              echo "::error::Missing required package asset: $dll"
              exit 1
            fi
          done

          write_file_entry() {
            local src="$1"
            local target="$2"

            if [ -f "$src" ]; then
              printf '              <file src="%s" target="%s" />\n' "$src" "$target"
            fi
          }

          {
            printf '              <file src="README.md" target="README.md" />\n'
            printf '              <file src="LICENSE" target="LICENSE" />\n'
            printf '              <file src="icon.png" target="icon.png" />\n'

            for framework in net10.0-android36.0 net10.0-ios26.0 net10.0-windows10.0.19041; do
              for extension in aar dll xml pdb pri; do
                write_file_entry "package/lib/${framework}/${PACKAGE_ID}.${extension}" "lib/${framework}"
              done
            done
          } > package-files.xml

          cat > "${PACKAGE_ID}.nuspec" <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <package xmlns="http://schemas.microsoft.com/packaging/2013/05/nuspec.xsd">
            <metadata>
              <id>${PACKAGE_ID}</id>
              <version>${BUILD_VERSION}</version>
              <authors>Jake Soenneker</authors>
              <license type="expression">MIT</license>
              <icon>icon.png</icon>
              <readme>README.md</readme>
              <projectUrl>https://github.com/soenneker/soenneker.azure.notificationhubs.maui</projectUrl>
              <description>A .NET MAUI library for Azure Notification Hubs push installation lifecycle, push channel management, permission handling, and notification tap routing.</description>
              <releaseNotes><![CDATA[${PACKAGE_RELEASE_NOTES}]]></releaseNotes>
              <copyright>Copyright © 2026 Jake Soenneker</copyright>
              <tags>azure notification-hubs maui push-notifications notifications fcm apns wns ios android windows dotnet</tags>
              <repository type="git" url="https://github.com/soenneker/soenneker.azure.notificationhubs.maui" branch="main" commit="${GITHUB_SHA}" />
              <dependencies>
                <group targetFramework="net10.0-android36.0">
                  <dependency id="Microsoft.Extensions.DependencyInjection.Abstractions" version="10.0.9" exclude="Build,Analyzers" />
                  <dependency id="Microsoft.Extensions.Options" version="10.0.9" exclude="Build,Analyzers" />
                  <dependency id="Microsoft.Maui.Essentials" version="10.0.71" exclude="Build,Analyzers" />
                  <dependency id="Soenneker.Gen.EnumValues" version="4.0.37" exclude="Build,Analyzers" />
                  <dependency id="Xamarin.Firebase.Messaging" version="125.0.2" exclude="Build,Analyzers" />
                </group>
                <group targetFramework="net10.0-ios26.0">
                  <dependency id="Microsoft.Extensions.DependencyInjection.Abstractions" version="10.0.9" exclude="Build,Analyzers" />
                  <dependency id="Microsoft.Extensions.Options" version="10.0.9" exclude="Build,Analyzers" />
                  <dependency id="Microsoft.Maui.Essentials" version="10.0.71" exclude="Build,Analyzers" />
                  <dependency id="Soenneker.Gen.EnumValues" version="4.0.37" exclude="Build,Analyzers" />
                </group>
                <group targetFramework="net10.0-windows10.0.19041">
                  <dependency id="Microsoft.Extensions.DependencyInjection.Abstractions" version="10.0.9" exclude="Build,Analyzers" />
                  <dependency id="Microsoft.Extensions.Options" version="10.0.9" exclude="Build,Analyzers" />
                  <dependency id="Microsoft.Maui.Essentials" version="10.0.71" exclude="Build,Analyzers" />
                  <dependency id="Soenneker.Gen.EnumValues" version="4.0.37" exclude="Build,Analyzers" />
                </group>
              </dependencies>
            </metadata>
            <files>
          $(cat package-files.xml)
            </files>
          </package>
          EOF

      - name: Pack
        run: dotnet pack ${{ env.PACKAGE_ID }}.nuspec --output ./artifacts

      - name: Publish to NuGet
        shell: bash
        run: |
          set -euo pipefail

          for i in 1 2; do
            output_file="$(mktemp)"

            set +e
            dotnet nuget push ./artifacts/*.nupkg \
              --source "https://api.nuget.org/v3/index.json" \
              --api-key "${{ secrets.NUGET__TOKEN }}" \
              --skip-duplicate 2>&1 | tee "$output_file"
            exit_code=${PIPESTATUS[0]}
            set -e

            if [ $exit_code -eq 0 ]; then
              exit 0
            fi

            if grep -qiE 'Quota Exceeded|retry after:' "$output_file"; then
              echo "NuGet throttled this publish. Not retrying inside the same job."
              exit 1
            fi

            if [ "$i" -lt 2 ]; then
              echo "Transient failure, retrying once in 15 seconds..."
              sleep 15
            else
              exit $exit_code
            fi
          done

      - name: Publish to GitHub Packages
        shell: bash
        run: |
          dotnet nuget push ./artifacts/*.nupkg \
            --source "https://nuget.pkg.github.com/soenneker/index.json" \
            --api-key "${{ secrets.GH__TOKEN }}" \
            --skip-duplicate

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GH__TOKEN }}
        shell: bash
        run: |
          gh release create "v$BUILD_VERSION" \
            --title "v$BUILD_VERSION" \
            --notes "${{ env.PACKAGE_RELEASE_NOTES }}"
