name: codeql

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - 'test/**'
  workflow_dispatch:

env:
  NUGET_XMLDOC_MODE: skip
  DOTNET_VERSION: 10.0.x
  CONFIGURATION: Release
  PROJECT: src/Soenneker.Azure.NotificationHubs.Maui/Soenneker.Azure.NotificationHubs.Maui.csproj
  FRAMEWORK: net10.0-windows10.0.19041.0

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: windows-latest
    name: CodeQL Analysis

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          workloads: maui-windows

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: manual

      - name: Restore src
        run: dotnet restore ${{ env.PROJECT }} /p:TargetFramework=${{ env.FRAMEWORK }} --verbosity minimal

      - name: Build src
        run: dotnet build ${{ env.PROJECT }} --configuration ${{ env.CONFIGURATION }} -f ${{ env.FRAMEWORK }} --no-restore --verbosity minimal

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
